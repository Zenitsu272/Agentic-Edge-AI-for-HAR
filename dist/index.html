      { id: 'james', initials: 'JM', name: 'James Martin', room: 'Room 118 · Wing B', state: 'Monitor', stateClass: 'monitor', last: 'Bed exit', time: '21 min ago', risk: 'Moderate', riskClass: 'med', width: '54%', color: '#d9e5db', detail: { lastEvent: 'Bed exit', eventTime: '21 min ago', confidence: '91%', reviewed: 'Today, 09:28', observation: 'Unusual night movement', observationDetail: 'Bed exit detected outside the resident’s usual overnight pattern.', decision: 'Review recommended', decisionDetail: 'The agent found a change from baseline routine.', memory: '2 prior bed-exit events', memoryTone: 'warn' } },
      { id: 'maya', initials: 'MC', name: 'Maya Chen', room: 'Room 307 · Wing A', state: 'Review', stateClass: 'review', last: 'Possible fall', time: '2 min ago', risk: 'High', riskClass: 'high', width: '82%', color: '#f0ddd4', detail: { lastEvent: 'Possible fall', eventTime: '2 min ago', confidence: '94%', reviewed: 'Today, 09:47', observation: 'Possible fall on floor', observationDetail: 'Pose model crossed the fall threshold. VLM verification is complete.', decision: 'Emergency alert sent', decisionDetail: 'No recovery observed during the follow-up window.', memory: '1 similar event this month', memoryTone: 'risk' } },
      { id: 'robert', initials: 'RE', name: 'Robert Ellis', room: 'Room 112 · Wing B', state: 'Stable', stateClass: 'stable', last: 'Resting', time: '34 min ago', risk: 'Low', riskClass: '', width: '22%', color: '#ded7cc', detail: { lastEvent: 'Resting', eventTime: '34 min ago', confidence: '98%', reviewed: 'Today, 09:15', observation: 'Resting in bed', observationDetail: 'Posture and duration match the resident’s normal rest pattern.', decision: 'Continue monitoring', decisionDetail: 'The agent found no escalation signal.', memory: '5 similar rest events', memoryTone: 'sage' } },
    ];

    function icon(name, size = 18) {
      const p = { grid: '<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/>', users: '<path d="M16 20v-1.5a4.5 4.5 0 0 0-4.5-4.5h-3A4.5 4.5 0 0 0 4 18.5V20"/><circle cx="10" cy="7" r="3"/><path d="M16 4.5a3 3 0 0 1 0 5.8M18 14.1a4.5 4.5 0 0 1 3 4.2V20"/>', bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>', activity: '<path d="M3 12h4l2.2-7L14 19l2-7h5"/>', arrow: '<path d="m9 18 6-6-6-6"/>', back: '<path d="m15 18-6-6 6-6"/>', clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>', check: '<path d="m5 12 4 4L19 6"/>', alert: '<path d="M10.3 4.2 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0ZM12 9v4m0 3h.01"/>', logout: '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>', heart: '<path d="M20.8 8.8c0 5.2-8.8 10-8.8 10s-8.8-4.8-8.8-10A4.8 4.8 0 0 1 12 6.5a4.8 4.8 0 0 1 8.8 2.3Z"/>' };
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name] || p.grid}</svg>`;
    }
    const logo = `<span class="brand-mark">${icon('heart', 20)}</span><span>CareWatch</span>`;
    const app = document.getElementById('app');
    let activeView = 'overview';
    let selectedPatient = null;

    function loginView() {
      app.innerHTML = `<main class="login-shell"><section class="login-visual"><div class="brand-lockup">${logo}</div><div class="login-copy"><div class="eyebrow">Agentic care intelligence</div><h1>Care that knows when to look closer.</h1><p>One calm workspace for resident safety, context and response.</p></div><div class="login-meta"><span class="signal-dot"></span> Secure clinical workspace</div></section><section class="login-panel"><div class="login-card"><div class="eyebrow">Welcome back</div><h2>Sign in</h2><p class="lead">Enter your workspace credentials to continue.</p><form id="loginForm"><div class="field"><label for="email">Work email</label><input id="email" type="email" placeholder="care@facility.org" required /></div><div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="••••••••" required /></div><button class="login-button" type="submit">Open workspace</button></form><p class="login-note">Demo interface · synthetic resident data</p></div></section></main>`;
      document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); workspaceView(); });
    }

    function sidebar() {
      const items = [['overview', 'Overview', 'grid'], ['patients', 'Patients', 'users'], ['alerts', 'Alerts', 'bell'], ['signals', 'Signals', 'activity']];
      return `<aside class="sidebar"><div class="brand-lockup">${logo}</div><nav class="sidebar-nav"><div class="nav-label">Workspace</div>${items.map(([id, label, ico]) => `<button class="nav-button ${activeView === id ? 'active' : ''}" data-view="${id}">${icon(ico)}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-spacer"></div><div class="sidebar-user"><span class="avatar">VT</span><div><strong>Vaishak T</strong><span>Care team admin</span></div><button class="logout" id="logoutBtn" aria-label="Log out">${icon('logout', 17)}</button></div></aside>`;
    }

    function topbar(title, subtitle) { return `<header class="topbar"><div><div class="eyebrow">CareWatch / ${activeView}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="top-actions"><span class="date-stamp">15 September 2026</span><span class="system-state"><i class="signal-dot"></i> All systems normal</span></div></header>`; }

    function metric(label, value, sub = '', alert = false) { return `<div class="metric ${alert ? 'alert' : ''}"><div class="metric-label">${label}</div><div class="metric-value">${value}${sub ? `<small>${sub}</small>` : ''}</div></div>`; }

    function patientCard(p) {
      return `<button class="patient-card" data-patient="${p.id}"><div class="patient-top"><div class="patient-id"><span class="avatar" style="background:${p.color}">${p.initials}</span><div><strong>${p.name}</strong><span>${p.room}</span></div></div><span class="badge ${p.stateClass}">${p.state}</span></div><div class="patient-meta"><div><span>Last signal</span><strong>${p.last}</strong><span>${p.time}</span></div><div><span>Risk level</span><strong>${p.risk}</strong><div class="risk-bar"><i class="${p.riskClass}" style="width:${p.width}"></i></div></div></div></button>`;
    }

    function feedItem(type, ico, title, copy, time) { return `<div class="feed-item ${type}"><span class="feed-icon">${icon(ico, 12)}</span><div><strong>${title}</strong><p>${copy}</p></div><span class="feed-time">${time}</span></div>`; }

    function overviewView() {
      activeView = 'overview'; selectedPatient = null;
      app.innerHTML = `<div class="workspace">${sidebar()}<main class="main">${topbar('Care overview', 'Quiet signals, clear decisions, timely support.')}<section class="metrics">${metric('Residents monitored', '24')} ${metric('Needs review', '3')} ${metric('Active alerts', '1', '', true)} ${metric('System uptime', '98.4', '%')}</section><div class="dashboard-grid"><section class="surface"><div class="surface-header"><div><h2>Resident watch</h2><p>Current status across monitored rooms</p></div><button class="text-button" id="viewPatients">View all patients ${icon('arrow', 13)}</button></div><div class="patient-grid">${patients.map(patientCard).join('')}</div></section><section class="surface"><div class="surface-header"><div><h2>Live activity</h2><p>Agent-reviewed events</p></div><button class="text-button" data-view="alerts">All alerts</button></div><div class="feed">${feedItem('', 'check', 'Routine movement', 'Anita Rao · Room 204', '8 min')} ${feedItem('review', 'clock', 'Bed exit detected', 'James Martin · Room 118', '21 min')} ${feedItem('alert', 'alert', 'Possible fall verified', 'Maya Chen · Room 307', '2 min')} ${feedItem('', 'activity', 'Resting pattern', 'Robert Ellis · Room 112', '34 min')}</div><div class="alert-strip"><span class="feed-icon">${icon('alert', 13)}</span><div><strong>1 alert requires attention</strong><p>Maya Chen · emergency alert sent 2 minutes ago.</p></div></div></section></div></main></div>`;
      bindWorkspace();
      document.getElementById('viewPatients')?.addEventListener('click', () => { activeView = 'patients'; workspaceView(); });
    }

    function patientsView() {
      activeView = 'patients'; selectedPatient = null;
      app.innerHTML = `<div class="workspace">${sidebar()}<main class="main">${topbar('Patients', 'Select a resident to open the full analysis.')}<section class="surface"><div class="surface-header"><div><h2>All residents</h2><p>4 active profiles · Synthetic demo data</p></div><span class="system-state"><i class="signal-dot"></i> Monitoring live</span></div><div class="patient-grid">${patients.map(patientCard).join('')}</div></section></main></div>`;
      bindWorkspace();
    }

    function alertsView() {
      activeView = 'alerts'; selectedPatient = null;
      app.innerHTML = `<div class="workspace">${sidebar()}<main class="main">${topbar('Alerts', 'Decisions that may need a human response.')}<section class="surface"><div class="surface-header"><div><h2>Alert queue</h2><p>Prioritised by severity and recency</p></div><span class="badge review">1 active</span></div><div class="feed">${feedItem('alert', 'alert', 'Possible fall verified', 'Maya Chen · Room 307 · No recovery observed during follow-up', '2 min')} ${feedItem('review', 'clock', 'Bed exit outside routine', 'James Martin · Room 118 · Agent recommends review', '21 min')} ${feedItem('', 'check', 'Routine movement cleared', 'Anita Rao · Room 204 · No escalation signal', '8 min')} ${feedItem('', 'check', 'Resting pattern cleared', 'Robert Ellis · Room 112 · Matches resident baseline', '34 min')}</div></section></main></div>`;
      bindWorkspace();
    }

    function signalsView() {
      activeView = 'signals'; selectedPatient = null;
      app.innerHTML = `<div class="workspace">${sidebar()}<main class="main">${topbar('Model signals', 'Perception outputs before agentic escalation.')}<section class="metrics">${metric('Motion gate', 'YOLO26n')} ${metric('Fall model', 'YOLO11n-Pose')} ${metric('Threshold', '70', '%')} ${metric('Events today', '12')}</section><div class="dashboard-grid"><section class="surface"><div class="surface-header"><div><h2>Signal pipeline</h2><p>From edge evidence to a verified decision</p></div></div><div class="feed">${feedItem('', 'activity', 'Motion gate', 'Filters the stream for relevant movement', 'Edge')} ${feedItem('', 'activity', 'Fall score', 'YOLO11n-Pose evaluates event clips', 'Edge')} ${feedItem('review', 'clock', 'VLM verification', 'Context and previous occurrences are checked', 'Agent')} ${feedItem('alert', 'alert', 'Escalation decision', 'Policy selects log, review or alert', 'Policy')}</div></section><section class="surface"><div class="surface-header"><div><h2>Decision split</h2><p>Today’s event outcomes</p></div></div><div class="mini-chart"><div class="bar" style="height:72%"><span>8</span></div><div class="bar" style="height:37%"><span>3</span></div><div class="bar current" style="height:18%"><span>1</span></div></div><div class="patient-meta" style="margin-top:30px"><div><span>Logged</span><strong>8 normal</strong></div><div><span>Escalated</span><strong>1 emergency</strong></div></div></section></div></main></div>`;
      bindWorkspace();
    }

    function detailView(p) {
      activeView = 'patients'; selectedPatient = p.id;
      const d = p.detail;
      app.innerHTML = `<div class="workspace">${sidebar()}<main class="main"><div class="detail-shell"><button class="back-link" id="backBtn">${icon('back', 15)} Back to patients</button><div class="detail-title"><div><div class="eyebrow">Patient profile / ${p.room}</div><h1>${p.name}</h1><p>Resident analysis · Last updated ${d.reviewed.toLowerCase()}</p></div><div class="detail-actions"><button class="outline-button">${icon('activity', 14)} Activity log</button><button class="outline-button">${icon('bell', 14)} Alert settings</button></div></div><section class="detail-summary"><div class="summary-card primary"><span>Current state</span><strong>${d.decision}</strong></div><div class="summary-card"><span>Last event</span><strong>${d.lastEvent}</strong></div><div class="summary-card"><span>Agent confidence</span><strong>${d.confidence}</strong></div><div class="summary-card"><span>Last review</span><strong>${d.reviewed.replace('Today, ', '')}</strong></div></section><div class="detail-grid"><section class="surface analysis-card"><div class="surface-header"><div><h2>Activity analysis</h2><p>Recent events and model evidence</p></div><span class="badge ${p.stateClass}">${p.state}</span></div><div class="timeline"><div class="timeline-item"><span class="timeline-time">09:12</span><div class="timeline-copy"><strong>Baseline movement</strong><p>Normal activity observed in the resident’s room.</p></div><span class="timeline-tag">Cleared</span></div><div class="timeline-item review"><span class="timeline-time">09:44</span><div class="timeline-copy"><strong>Motion event captured</strong><p>Edge gate created a short event clip for analysis.</p></div><span class="timeline-tag">Review</span></div><div class="timeline-item alert"><span class="timeline-time">09:45</span><div class="timeline-copy"><strong>${d.observation}</strong><p>${d.observationDetail}</p></div><span class="timeline-tag">${p.id === 'maya' ? 'Verified' : 'Observed'}</span></div><div class="timeline-item"><span class="timeline-time">09:47</span><div class="timeline-copy"><strong>Agentic decision</strong><p>${d.decisionDetail}</p></div><span class="timeline-tag">Logged</span></div></div></section><section class="surface agent-card"><div class="surface-header"><div><h2>Agent assessment</h2><p>Evidence assembled for this decision</p></div>${icon('activity', 18)}</div><div class="agent-pulse"><span class="signal-dot"></span> Reasoning complete</div><div class="agent-observation"><span class="small-label">Verified observation</span><strong>${d.observation}</strong><p>${d.observationDetail}</p></div><div class="agent-row"><span>Fall score</span><strong>${p.id === 'maya' ? '82%' : '18%'}</strong></div><div class="agent-row"><span>Memory match</span><strong>${d.memory}</strong></div><div class="agent-row"><span>Follow-up</span><strong>${p.id === 'maya' ? 'No recovery' : 'Not required'}</strong></div><div class="decision"><span class="small-label">Escalation decision</span><strong>${d.decision}</strong></div></section></div><div class="detail-bottom"><section class="surface"><div class="surface-header"><div><h2>Activity rhythm</h2><p>Last 7 monitored intervals</p></div></div><div class="mini-chart"><div class="bar" style="height:54%"><span>M</span></div><div class="bar" style="height:72%"><span>T</span></div><div class="bar" style="height:43%"><span>W</span></div><div class="bar" style="height:66%"><span>T</span></div><div class="bar" style="height:79%"><span>F</span></div><div class="bar" style="height:61%"><span>S</span></div><div class="bar current" style="height:88%"><span>S</span></div></div></section><section class="surface"><div class="surface-header"><div><h2>Safety signals</h2><p>Current model evidence</p></div></div><div class="signal-list"><div class="signal-row"><div><strong>Motion consistency</strong><span>Compared with resident baseline</span></div><span class="score">Normal</span></div><div class="signal-row"><div><strong>Fall posture</strong><span>Pose model output</span></div><span class="score ${p.id === 'maya' ? 'risk' : ''}">${p.id === 'maya' ? 'Review' : 'Clear'}</span></div><div class="signal-row"><div><strong>Recovery observed</strong><span>Follow-up window</span></div><span class="score ${p.id === 'maya' ? 'risk' : 'warn'}">${p.id === 'maya' ? 'No' : 'Yes'}</span></div></div></section></div></div></main></div>`;
      bindWorkspace();
      document.getElementById('backBtn')?.addEventListener('click', () => { patientsView(); });
    }

    function bindWorkspace() {
      document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => { const v = btn.dataset.view; if (v === 'overview') overviewView(); else if (v === 'patients') patientsView(); else if (v === 'alerts') alertsView(); else signalsView(); }));
      document.querySelectorAll('[data-patient]').forEach(btn => btn.addEventListener('click', () => { detailView(patients.find(p => p.id === btn.dataset.patient)); }));
      document.getElementById('logoutBtn')?.addEventListener('click', loginView);
    }
    function workspaceView() { if (activeView === 'patients') patientsView(); else if (activeView === 'alerts') alertsView(); else if (activeView === 'signals') signalsView(); else overviewView(); }
    loginView();
  </script>
</body>
</html>
